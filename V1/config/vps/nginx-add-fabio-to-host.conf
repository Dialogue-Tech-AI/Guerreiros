# =============================================================================
# ADICIONAR no nginx do HOST (Ubuntu), além do bloco que já existe para o João.
#
# Domínio Fabio: atendimento-fabioguerreiro.dialoguetech.com.br → 127.0.0.1:8082
# Domínio João:  atendimento-joaoguerreiro.dialoguetech.com.br → 127.0.0.1:8081 (já configurado)
#
# Certificados: mesmos ficheiros do bloco HTTPS do João nesta VPS
# (atendimento-joaoguerreiro em /etc/nginx/ssl/joao-guerreiro/).
#
# sudo cp para /etc/nginx/sites-available/guerreiros-fabio.conf
# sudo ln -sf /etc/nginx/sites-available/guerreiros-fabio.conf /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

server {
    listen 80;
    server_name atendimento-fabioguerreiro.dialoguetech.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name atendimento-fabioguerreiro.dialoguetech.com.br;

    ssl_certificate     /etc/nginx/ssl/joao-guerreiro/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/joao-guerreiro/origin.key;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
