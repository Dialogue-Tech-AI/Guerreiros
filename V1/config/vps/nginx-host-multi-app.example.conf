# =============================================================================
# EXEMPLO — copiar trechos para /etc/nginx/sites-available/ no HOST (não Docker)
# Ajuste os server_name para os seus domínios reais.
#
# João (já em uso): proxy para 127.0.0.1:8081
# Fabio / Guerreiros: proxy para 127.0.0.1:8082 (após subir compose com override)
#
# Depois: sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# Upstreams (opcional, deixa explícito)
upstream joao_frontend {
    server 127.0.0.1:8081;
}
upstream guerreiros_frontend {
    server 127.0.0.1:8082;
}

# HTTP → HTTPS (ajuste server_name)
server {
    listen 80;
    server_name atendimento-fabioguerreiro.dialoguetech.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name SEU_DOMINIO_JOAO.dialoguetech.com.br;
    return 301 https://$host$request_uri;
}

# HTTPS Fabio / Guerreiros (substitua paths de certificado pelos seus)
server {
    listen 443 ssl http2;
    server_name atendimento-fabioguerreiro.dialoguetech.com.br;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    location / {
        proxy_pass http://guerreiros_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://guerreiros_frontend;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io {
        proxy_pass http://guerreiros_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}

# HTTPS João (mesmo padrão; upstream joao_frontend)
