# =============================================================================
# Use quando o servidor JÁ tem nginx (ou outro proxy) nos ports 80/443 e outra
# app Docker (ex.: João em 8081). Evita conflito e permite routear por domínio.
#
# Uso na VPS:
#   cd ~/Guerreiros/V1
#   docker compose -f docker-compose.vps.yml -f config/vps/compose.override.host-nginx.yml up -d --build
#
# O frontend Guerreiros fica em HTTP na porta do host 8082 → container :80
# (SSL termina no nginx do host; ver nginx-host-multi-app.example.conf).
# =============================================================================
services:
  frontend:
    ports:
      - "8082:80"
